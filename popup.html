<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
      --bg: #f5f7fc;
      --card: #ffffff;
      --text: #172033;
      --muted: #748096;
      --border: #e6eaf2;
      --primary: #5268ee;
      --primary-hover: #4055dc;
      --soft: #f0f2ff;
      --error: #c83232;
      --success: #2f9e44;
      --shadow: 0 14px 35px rgba(35, 49, 93, 0.08);
    }

    body.dark {
      color-scheme: dark;
      --bg: #111520;
      --card: #1c2230;
      --text: #f1f4fa;
      --muted: #a2adc0;
      --border: #30394b;
      --primary: #7385ff;
      --primary-hover: #8796ff;
      --soft: #292f50;
      --error: #ff8585;
      --success: #51cf66;
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
    }

    body {
      width: 326px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, sans-serif;
    }

    .card {
      position: relative;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 38px;
      margin-bottom: 19px;
      padding-right: 40px;
    }

    .logo {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #5268ee, #8976f1);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .theme-button {
      position: absolute;
      top: 17px;
      right: 17px;
      display: grid;
      width: 36px;
      height: 36px;
      min-height: 36px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .theme-button:hover {
      background: var(--soft);
    }

    .theme-button:active {
      transform: scale(0.94);
    }

    .theme-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Значок обозначает именно текущую тему. */
    .moon-icon,
    body.dark .sun-icon {
      display: none;
    }

    body.dark .moon-icon {
      display: block;
    }

    .update-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -6px 0 15px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 12px;
      background: var(--soft);
    }

    .update-banner[hidden] {
      display: none;
    }

    .update-text {
      min-width: 0;
      font-size: 12px;
      font-weight: 550;
      overflow-wrap: anywhere;
    }

    .update-text b {
      font-weight: 750;
    }

    .update-button {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 5px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      transition: background 0.15s, transform 0.15s;
    }

    .update-button:hover {
      background: var(--primary-hover);
    }

    .update-button:active {
      transform: scale(0.96);
    }

    .field-label {
      display: block;
      margin: 0 0 7px;
      font-weight: 650;
    }

    select {
      width: 100%;
      height: 39px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }

    select:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .options {
      display: grid;
      gap: 1px;
      margin: 15px 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .option {
      display: flex;
      min-height: 43px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .option + .option {
      border-top: 1px solid var(--border);
    }

    .option span {
      font-weight: 550;
    }

    .option input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .option-text {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    #siteHost {
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    .option.unavailable {
      cursor: default;
      opacity: 0.55;
    }

    .hint {
      margin: -5px 0 15px;
      color: var(--muted);
      font-size: 11px;
    }

    .buttons {
      display: grid;
      gap: 8px;
    }

    .action-button {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background 0.15s, transform 0.15s;
    }

    .action-button:hover:not(:disabled) {
      background: var(--soft);
    }

    .action-button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .action-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #translate {
      border-color: transparent;
      background: var(--primary);
      color: #fff;
    }

    #translate:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #error {
      margin: 12px 2px 0;
      color: var(--error);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #error:empty {
      display: none;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 2px -2px;
      color: var(--muted);
      font-size: 11px;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-fill {
      flex: 1;
    }

    .icon-button {
      display: grid;
      width: 24px;
      height: 24px;
      min-height: 24px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }

    .icon-button:hover:not(:disabled) {
      background: var(--soft);
      color: var(--text);
    }

    .icon-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .icon-button.spin {
      animation: nt-rotate 0.9s linear infinite;
    }

    .icon-button.ok {
      color: var(--success);
      animation: none;
    }

    @keyframes nt-rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="header">
      <div class="logo">文</div>

      <div>
        <h1>Neat Translate</h1>
        <p class="subtitle">Перевод без замены разметки</p>
      </div>
    </div>

    <button
      id="themeButton"
      class="theme-button"
      type="button"
      title="Текущая тема: светлая. Переключить на тёмную"
      aria-label="Текущая тема: светлая. Переключить на тёмную"
    >
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
      </svg>

      <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"></path>
      </svg>
    </button>

    <div id="updateBanner" class="update-banner" hidden>
      <span class="update-text">
        Доступна версия <b id="updateVersion"></b>
      </span>

      <button id="updateButton" class="update-button" type="button">
        Обновить
      </button>
    </div>

    <label class="field-label" for="target">Язык перевода</label>

    <select id="target">
      <option value="ru">Русский</option>
      <option value="en">Английский</option>
      <option value="de">Немецкий</option>
      <option value="fr">Французский</option>
      <option value="es">Испанский</option>
      <option value="it">Итальянский</option>
      <option value="pt">Португальский</option>
      <option value="ja">Японский</option>
      <option value="zh-CN">Китайский</option>
    </select>

    <div class="options">
      <label class="option">
        <span>Автоперевод</span>
        <input id="autoTranslate" type="checkbox">
      </label>

      <label class="option" id="siteOption">
        <span class="option-text">
          <span>Не переводить этот сайт</span>
          <span id="siteHost"></span>
        </span>
        <input id="skipSite" type="checkbox">
      </label>

      <label class="option">
        <span>Оригинал по Alt</span>
        <input id="showOriginal" type="checkbox">
      </label>
    </div>

    <p class="hint">
      Зажми Alt и наведи курсор на переведённый текст.
      «Не переводить этот сайт» действует на весь домен
      и работает только с включённым автопереводом.
    </p>

    <div class="buttons">
      <button id="translate" class="action-button" type="button">
        Перевести страницу
      </button>

      <div class="secondary-row">
        <button id="selection" class="action-button" type="button">
          Выделенный текст
        </button>

        <button id="restore" class="action-button" type="button">
          Оригинал
        </button>
      </div>
    </div>

    <p id="error" role="alert"></p>

    <div class="footer">
      <a
        href="https://github.com/BigKerambit/neat-translate-free"
        target="_blank"
        rel="noopener"
      >GitHub</a>

      <span class="footer-fill"></span>

      <span>v<span id="appVersion"></span></span>

      <button
        id="checkUpdates"
        class="icon-button"
        type="button"
        title="Проверить обновления"
        aria-label="Проверить обновления"
      >⟳</button>
    </div>
  </main>

  <script src="popup.js"></script>

</html>
